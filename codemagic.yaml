workflows:
  android-workflow:
    name: Compilar APK Android
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Obtener dependencias
        script: | 
          flutter pub get
      - name: Compilar APK Gratuito
        script: | 
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
